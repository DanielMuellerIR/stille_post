name: StillePostMobile
options:
  bundleIdPrefix: io.github.danielmuellerir.stillepost
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  knownRegions: [de, en, Base]
packages:
  StillePostClientCore:
    path: StillePostClientCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.42"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  StillePostMobile:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: StillePostClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.danielmuellerir.stillepost.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/StillePostMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          MOBILE_APP_NAME: Stille Post Dev
        Release:
          MOBILE_APP_NAME: Stille Post
  StillePostMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StillePostMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.danielmuellerir.stillepost.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StillePostMobile:
    build:
      targets:
        StillePostMobile: all
    test:
      targets: [StillePostMobileUITests]
      environmentVariables:
        STILLEPOST_RUN_BRIDGE_UI_TEST: $(STILLEPOST_RUN_BRIDGE_UI_TEST)
        STILLEPOST_RUN_DEVICE_BRIDGE_TEST: $(STILLEPOST_RUN_DEVICE_BRIDGE_TEST)
